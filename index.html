<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardmaxxx | cardmaxx12 on eBay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Foil effect */
        .foil-text {
            background: linear-gradient(
                45deg,
                #ffdf00,
                #d4af37,
                #ffdf00,
                #f9f295,
                #d4af37,
                #ffdf00
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center font-sans p-4" style="background-image: radial-gradient(circle at top right, #1f2937 0%, #030712 100%);">
    <div class="glass-card max-w-md w-full rounded-2xl p-10 text-center transform transition duration-500 hover:-translate-y-2">
        <!-- Logo / Branding -->
        <div class="mb-6">
            <h1 class="text-5xl font-extrabold mb-1 uppercase tracking-widest foil-text">Cardmaxxx</h1>
            <p class="text-gray-400 text-sm font-medium tracking-wide">eBay Store: @cardmaxx12</p>
        </div>
        
        <!-- Details -->
        <div class="mb-10 space-y-2">
            <p class="text-gray-100 text-xl font-semibold">Premium Sports Cards & TCG</p>
            <p class="text-gray-400 text-sm">Specializing in soccer singles and refractors.</p>
        </div>

        <!-- Call to Action -->
        <a href="https://www.ebay.com/usr/cardmaxx12" class="inline-block w-full py-4 px-6 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg transition-all duration-300 shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.8)] focus:outline-none focus:ring-4 focus:ring-blue-800">
            Visit My eBay Store
        </a>

        <!-- Footer -->
        <div class="mt-10 pt-6 border-t border-gray-800 text-xs text-gray-500">
            <p>&copy; 2026 Cardmaxxx. Based in Sacramento, CA.</p>
        </div>
    </div>
</body>
</html>
