
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardMaxx12 | Premier Trading Cards</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19; /* Deep dark slate */
            color: #ffffff;
        }

        .font-display {
            font-family: 'Syncopate', sans-serif;
        }

        /* Subtle floating animation for background elements */
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }

        .blob-1 {
            animation: float 8s ease-in-out infinite;
        }
        
        .blob-2 {
            animation: float 12s ease-in-out infinite reverse;
        }

        /* Gold Foil Shimmer Effect for Button */
        .btn-gold-foil {
            background: linear-gradient(60deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            background-size: 300% 300%;
            color: #111;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.3);
        }

        .btn-gold-foil:hover {
            background-position: 100% 50%;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(191, 149, 63, 0.5);
        }

        /* Text Gradient for Logo */
        .text-gradient {
            background: linear-gradient(to right, #ffffff, #a0aec0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Entrance Animation */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        /* Subtle card grid background pattern */
        .bg-pattern {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center center;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden antialiased selection:bg-yellow-500 selection:text-black">

    <!-- Decorative Ambient Background Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-blue-900/20 blur-[100px] blob-1"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-yellow-600/10 blur-[120px] blob-2"></div>
        <div class="absolute top-[40%] left-[50%] translate-x-[-50%] w-[60vw] h-[30vw] rounded-full bg-purple-900/10 blur-[150px]"></div>
    </div>
    
    <!-- Grid Overlay -->
    <div class="fixed inset-0 bg-pattern pointer-events-none z-0 mix-blend-overlay"></div>

    <!-- Top Navigation / Header -->
    <header class="w-full p-6 relative z-10 flex justify-center lg:justify-start">
        <div class="fade-in-up">
            <!-- Optional: Small logo or icon could go here in the future -->
        </div>
    </header>

    <!-- Main Content / Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 relative z-10 text-center w-full max-w-4xl mx-auto">
        
        <!-- Premium Badge -->
        <div class="fade-in-up delay-100 mb-6">
            <span class="inline-block py-1 px-3 rounded-full border border-yellow-500/30 bg-yellow-500/10 text-yellow-400 text-xs font-semibold tracking-widest uppercase backdrop-blur-sm">
                Official Storefront
            </span>
        </div>

        <!-- Brand Name -->
        <h1 class="fade-in-up delay-200 text-5xl sm:text-6xl md:text-8xl font-display tracking-tighter mb-4 drop-shadow-2xl">
            CARD<span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-200">MAXX</span>12
        </h1>

        <!-- Tagline -->
        <p class="fade-in-up delay-300 text-lg sm:text-xl md:text-2xl text-slate-300 max-w-2xl mx-auto mb-10 font-light leading-relaxed">
            Your premier destination for rare, graded, and raw trading cards. Elevate your collection today.
        </p>

        <!-- Call To Action Button -->
        <div class="fade-in-up delay-300 w-full flex justify-center">
            <a href="https://www.ebay.com/usr/cardmaxx12" target="_blank" rel="noopener noreferrer" 
               class="btn-gold-foil group relative inline-flex items-center justify-center px-8 py-4 text-lg font-bold rounded-xl overflow-hidden focus:outline-none focus:ring-4 focus:ring-yellow-500/50">
                
                <span class="relative z-10 flex items-center gap-3">
                    Visit Our eBay Store
                    <!-- SVG Arrow Icon -->
                    <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </span>
            </a>
        </div>
        
        <!-- Trust Indicators (Optional but good for conversions) -->
        <div class="fade-in-up delay-300 mt-12 flex items-center justify-center gap-6 opacity-60 grayscale hover:grayscale-0 transition-all duration-300">
            <div class="flex flex-col items-center">
                <span class="text-2xl">⭐</span>
                <span class="text-xs mt-1 font-medium tracking-wide">Top Rated</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-2xl">📦</span>
                <span class="text-xs mt-1 font-medium tracking-wide">Fast Shipping</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-2xl">🛡️</span>
                <span class="text-xs mt-1 font-medium tracking-wide">Secure</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full p-6 relative z-10 text-center border-t border-white/5 bg-black/20 backdrop-blur-md">
        <p class="text-slate-500 text-sm">
            &copy; <script>document.write(new Date().getFullYear())</script> CardMaxx12. All rights reserved.
        </p>
    </footer>

</body>
</html>
